<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Our website is currently under maintenance. We'll be back online shortly with something amazing." />
  <meta name="theme-color" content="#0f0c29" />
  <title>We'll Be Back Soon — Under Maintenance</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Design tokens
       ============================================================ */
    :root {
      --bg-1: #0f0c29;
      --bg-2: #1a1440;
      --bg-3: #24243e;
      --accent-1: #7f5af0;   /* violet */
      --accent-2: #2cb1ff;   /* sky    */
      --accent-3: #ff5c8a;   /* pink   */
      --accent-4: #00e6c3;   /* teal   */
      --text: #eef0ff;
      --text-dim: #a9adce;
      --card: rgba(255, 255, 255, 0.06);
      --card-brd: rgba(255, 255, 255, 0.12);
      --glow: 0 0 40px rgba(127, 90, 240, 0.45);
      --font-head: 'Sora', system-ui, sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background: #0b0920;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    /* ============================================================
       Animated gradient background
       ============================================================ */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #302b63);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating aurora blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: -2;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .blob.b1 { width: 460px; height: 460px; background: var(--accent-1); top: -120px; left: -80px;  animation: float1 16s ease-in-out infinite; }
    .blob.b2 { width: 400px; height: 400px; background: var(--accent-2); bottom: -140px; right: -60px; animation: float2 20s ease-in-out infinite; }
    .blob.b3 { width: 320px; height: 320px; background: var(--accent-3); top: 40%; right: 20%;         animation: float3 22s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(120px,80px) scale(1.15);} }
    @keyframes float2 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-100px,-60px) scale(1.1);} }
    @keyframes float3 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-80px,90px) scale(1.2);} }

    /* Particle canvas */
    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       Card
       ============================================================ */
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--card-brd);
      border-radius: 28px;
      padding: 3.25rem 2.75rem 3rem;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* animated top border sheen */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-4), var(--accent-3), var(--accent-1));
      background-size: 300% 100%;
      animation: sheen 6s linear infinite;
    }
    @keyframes sheen { 0%{ background-position: 0% 0;} 100%{ background-position: 300% 0;} }

    /* ============================================================
       Animated gear / logo mark
       ============================================================ */
    .mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 1.5rem;
      position: relative;
      display: grid;
      place-items: center;
    }
    .mark .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.25);
      animation: spin 12s linear infinite;
    }
    .mark .core {
      width: 62px; height: 62px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: grid; place-items: center;
      box-shadow: var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }
    .mark svg { width: 34px; height: 34px; color: #fff; animation: spin 8s linear infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.08); } }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-4);
      background: rgba(0, 230, 195, 0.1);
      border: 1px solid rgba(0, 230, 195, 0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.4rem;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-4);
      box-shadow: 0 0 10px var(--accent-4);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    h1 {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    h1 .grad {
      background: linear-gradient(120deg, var(--accent-2), var(--accent-1) 40%, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: clamp(0.98rem, 2.4vw, 1.1rem);
      line-height: 1.6;
      max-width: 46ch;
      margin: 0 auto 2rem;
    }

    /* ============================================================
       Countdown
       ============================================================ */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      margin-bottom: 2.25rem;
      flex-wrap: wrap;
    }
    .cd-unit {
      min-width: 84px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-brd);
      border-radius: 16px;
      padding: 1rem 0.75rem 0.8rem;
      position: relative;
      overflow: hidden;
    }
    .cd-unit .num {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #fff, #cdd2ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
    }
    .cd-unit .lbl {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ============================================================
       Progress bar
       ============================================================ */
    .progress-wrap { max-width: 420px; margin: 0 auto 2.25rem; }
    .progress-top {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .progress-top strong { color: var(--text); }
    .progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-4));
      background-size: 200% 100%;
      animation: fillGrow 2.2s cubic-bezier(0.22,1,0.36,1) forwards, shimmer 2.5s linear infinite;
    }
    @keyframes fillGrow { to { width: 72%; } }
    @keyframes shimmer  { to { background-position: 200% 0; } }

    /* ============================================================
       Email signup
       ============================================================ */
    .notify { max-width: 460px; margin: 0 auto 1.75rem; }
    .notify form {
      display: flex;
      gap: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-brd);
      border-radius: 14px;
      padding: 0.4rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .notify form:focus-within {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 4px rgba(127,90,240,0.18);
    }
    .notify input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
    }
    .notify input::placeholder { color: var(--text-dim); }
    .btn {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      background-size: 180% 180%;
      transition: transform 0.2s, box-shadow 0.3s, background-position 0.5s;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(44,177,255,0.4);
      background-position: 100% 0;
    }
    .btn:active { transform: translateY(0); }
    .notify .msg {
      font-size: 0.82rem;
      margin-top: 0.7rem;
      min-height: 1.1rem;
      color: var(--accent-4);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .notify .msg.show { opacity: 1; }

    /* ============================================================
       Scrolling animated animal scene
       ============================================================ */
    .scene {
      position: relative;
      height: 96px;
      margin: 0.5rem -2.75rem -3rem;   /* bleed to the card edges */
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, transparent, rgba(127,90,240,0.08));
    }
    /* moving ground stripes for a sense of scrolling */
    .scene .ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        repeating-linear-gradient(90deg,
          rgba(255,255,255,0.12) 0 22px,
          transparent 22px 60px);
      background-size: 100% 100%, 82px 100%;
      animation: groundScroll 2.4s linear infinite;
    }
    @keyframes groundScroll { to { background-position: 0 0, -82px 0; } }

    /* little parallax stars/dust drifting the other way */
    .scene .dust {
      position: absolute;
      inset: 0 0 26px 0;
      background:
        radial-gradient(2px 2px at 20% 40%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 55% 20%, rgba(0,230,195,0.6), transparent),
        radial-gradient(2px 2px at 80% 55%, rgba(44,177,255,0.6), transparent);
      background-size: 240px 100%;
      animation: dustScroll 6s linear infinite;
      opacity: 0.8;
    }
    @keyframes dustScroll { to { background-position: -240px 0; } }

    /* the animal that trots across the scene (slow, relaxed pace) */
    .runner {
      position: absolute;
      bottom: 18px;
      left: -90px;
      width: 78px;
      height: auto;
      animation: run 13s linear infinite;
      will-change: transform;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
    }
    @keyframes run {
      0%   { transform: translateX(0)               translateY(0); }
      100% { transform: translateX(calc(720px + 180px)) translateY(0); }
    }
    /* body bobbing while trotting */
    .runner .body-bob { animation: bob 0.9s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg);} 50% { transform: translateY(-3px) rotate(1.2deg);} }

    /* All four legs swing in a diagonal trot gait.
       Front-left + back-right move together (phase A);
       Front-right + back-left move together (phase B). */
    .runner .leg { transform-origin: top center; }
    .runner .leg-a { animation: legA 0.9s ease-in-out infinite; }
    .runner .leg-b { animation: legB 0.9s ease-in-out infinite; }
    @keyframes legA { 0%,100%{ transform: rotate(22deg);} 50%{ transform: rotate(-22deg);} }
    @keyframes legB { 0%,100%{ transform: rotate(-22deg);} 50%{ transform: rotate(22deg);} }

    /* wagging tail */
    .runner .tail { animation: wag 1s ease-in-out infinite; transform-origin: 8px 20px; }
    @keyframes wag { 0%,100%{ transform: rotate(-12deg);} 50%{ transform: rotate(14deg);} }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem 2.25rem; border-radius: 22px; }
      .cd-unit { min-width: 68px; }
      .scene {
        margin: 0.5rem -1.5rem -2.25rem;
        border-bottom-left-radius: 22px;
        border-bottom-right-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card" role="main">
    <div class="mark" aria-hidden="true">
      <span class="ring"></span>
      <span class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </span>
    </div>

    <span class="badge"><span class="dot"></span> System Upgrade in Progress</span>

    <h1>We&rsquo;re Making Things <span class="grad">Better</span></h1>
    <p class="subtitle">
      Our site is getting a fresh coat of paint and some powerful new features.
      We&rsquo;ll be back online shortly — thanks for your patience!
    </p>

    <div class="countdown" id="countdown" aria-label="Time remaining until relaunch">
      <div class="cd-unit"><span class="num" id="hours">00</span><span class="lbl">Hours</span></div>
      <div class="cd-unit"><span class="num" id="minutes">00</span><span class="lbl">Minutes</span></div>
      <div class="cd-unit"><span class="num" id="seconds">00</span><span class="lbl">Seconds</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-top"><span>Upgrade progress</span><strong>72%</strong></div>
      <div class="progress"><div class="fill"></div></div>
    </div>

    <div class="scene" aria-hidden="true">
      <div class="dust"></div>
      <div class="ground"></div>

      <!-- Running fox / cat that scrolls across the scene -->
      <svg class="runner" viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="furGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff8a4c"/>
            <stop offset="1" stop-color="#ff5c8a"/>
          </linearGradient>
        </defs>

        <!-- BACK legs (behind the body) -->
        <!-- back-left pairs diagonally with front-right (phase B) -->
        <g class="leg leg-b">
          <rect x="30" y="52" width="7" height="20" rx="3.5" fill="#e0533f"/>
        </g>
        <!-- back-right pairs diagonally with front-left (phase A) -->
        <g class="leg leg-a">
          <rect x="78" y="52" width="7" height="20" rx="3.5" fill="#e0533f"/>
        </g>

        <g class="body-bob">
          <!-- tail -->
          <g class="tail">
            <path d="M18 40 C 2 34, 0 20, 8 10 C 6 22, 16 28, 26 34 Z" fill="url(#furGrad)"/>
            <path d="M12 20 C 8 16, 8 12, 10 9 C 10 15, 16 18, 20 22 Z" fill="#fff" opacity="0.85"/>
          </g>

          <!-- body -->
          <ellipse cx="60" cy="44" rx="34" ry="18" fill="url(#furGrad)"/>

          <!-- FRONT legs (in front of the body) -->
          <!-- front-left pairs diagonally with back-right (phase A) -->
          <g class="leg leg-a">
            <rect x="44" y="52" width="7" height="20" rx="3.5" fill="#ff6a3c"/>
          </g>
          <!-- front-right pairs diagonally with back-left (phase B) -->
          <g class="leg leg-b">
            <rect x="70" y="52" width="7" height="20" rx="3.5" fill="#ff6a3c"/>
          </g>

          <!-- head -->
          <g>
            <circle cx="94" cy="34" r="16" fill="url(#furGrad)"/>
            <!-- ears -->
            <path d="M84 24 L82 10 L94 20 Z" fill="url(#furGrad)"/>
            <path d="M104 24 L108 11 L112 24 Z" fill="url(#furGrad)"/>
            <path d="M86 22 L85 14 L91 20 Z" fill="#fff" opacity="0.85"/>
            <path d="M104 22 L107 14 L109 23 Z" fill="#fff" opacity="0.85"/>
            <!-- snout -->
            <path d="M96 34 C 110 30, 116 36, 108 42 C 104 44, 98 42, 96 40 Z" fill="#fff"/>
            <circle cx="110" cy="37" r="2.4" fill="#2b2b3a"/>
            <!-- eye -->
            <circle cx="98" cy="31" r="2.6" fill="#2b2b3a"/>
            <circle cx="99" cy="30" r="0.9" fill="#fff"/>
          </g>
        </g>
      </svg>
    </div>
  </main>

  <script>
    /* ---------- Countdown timer ----------
       Counts down to a target 23 hours from first load (persisted in localStorage
       so the timer stays consistent across refreshes for a given visitor). */
    (function () {
      var KEY = 'maintenance_launch_target_23h';
      var target = parseInt(localStorage.getItem(KEY), 10);
      if (!target || isNaN(target)) {
        target = Date.now() + 23 * 60 * 60 * 1000; // 23 hours from now
        localStorage.setItem(KEY, target);
      }
      var el = {
        h: document.getElementById('hours'),
        m: document.getElementById('minutes'),
        s: document.getElementById('seconds')
      };
      function pad(n) { return String(n).padStart(2, '0'); }
      function tick() {
        var diff = Math.max(0, target - Date.now());
        var s = Math.floor(diff / 1000);
        el.h.textContent = pad(Math.floor(s / 3600));
        el.m.textContent = pad(Math.floor((s % 3600) / 60));
        el.s.textContent = pad(s % 60);
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ---------- Particle field ---------- */
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var COUNT = 70;
      var w, h, dpr;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function init() {
        particles = [];
        for (var i = 0; i < COUNT; i++) {
          particles.push({
            x: rand(0, w), y: rand(0, h),
            vx: rand(-0.25, 0.25) * dpr, vy: rand(-0.25, 0.25) * dpr,
            r: rand(0.6, 2.2) * dpr
          });
        }
      }
      var colors = ['127,90,240', '44,177,255', '0,230,195', '255,92,138'];
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fill();
          // connect nearby particles
          for (var j = i + 1; j < particles.length; j++) {
            var q = particles[j];
            var dx = p.x - q.x, dy = p.y - q.y;
            var dist = dx * dx + dy * dy;
            var max = (120 * dpr) * (120 * dpr);
            if (dist < max) {
              var alpha = (1 - dist / max) * 0.28;
              ctx.strokeStyle = 'rgba(' + colors[i % colors.length] + ',' + alpha + ')';
              ctx.lineWidth = dpr * 0.6;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      resize(); init();
      if (!reduce) { draw(); }
      window.addEventListener('resize', function () { resize(); init(); });
    })();
  </script>
