<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Our website is currently under maintenance. We'll be back online shortly with something amazing." />
  <meta name="theme-color" content="#0f0c29" />
  <title>We'll Be Back Soon — Under Maintenance</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Design tokens
       ============================================================ */
    :root {
      --bg-1: #0f0c29;
      --bg-2: #1a1440;
      --bg-3: #24243e;
      --accent-1: #7f5af0;   /* violet */
      --accent-2: #2cb1ff;   /* sky    */
      --accent-3: #ff5c8a;   /* pink   */
      --accent-4: #00e6c3;   /* teal   */
      --text: #eef0ff;
      --text-dim: #a9adce;
      --card: rgba(255, 255, 255, 0.06);
      --card-brd: rgba(255, 255, 255, 0.12);
      --glow: 0 0 40px rgba(127, 90, 240, 0.45);
      --font-head: 'Sora', system-ui, sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background: #0b0920;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    /* ============================================================
       Animated gradient background
       ============================================================ */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #302b63);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating aurora blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: -2;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .blob.b1 { width: 460px; height: 460px; background: var(--accent-1); top: -120px; left: -80px;  animation: float1 16s ease-in-out infinite; }
    .blob.b2 { width: 400px; height: 400px; background: var(--accent-2); bottom: -140px; right: -60px; animation: float2 20s ease-in-out infinite; }
    .blob.b3 { width: 320px; height: 320px; background: var(--accent-3); top: 40%; right: 20%;         animation: float3 22s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(120px,80px) scale(1.15);} }
    @keyframes float2 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-100px,-60px) scale(1.1);} }
    @keyframes float3 { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-80px,90px) scale(1.2);} }

    /* Particle canvas */
    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       Card
       ============================================================ */
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--card-brd);
      border-radius: 28px;
      padding: 3.25rem 2.75rem 3rem;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* animated top border sheen */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-4), var(--accent-3), var(--accent-1));
      background-size: 300% 100%;
      animation: sheen 6s linear infinite;
    }
    @keyframes sheen { 0%{ background-position: 0% 0;} 100%{ background-position: 300% 0;} }

    /* ============================================================
       Animated gear / logo mark
       ============================================================ */
    .mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 1.5rem;
      position: relative;
      display: grid;
      place-items: center;
    }
    .mark .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.25);
      animation: spin 12s linear infinite;
    }
    .mark .core {
      width: 62px; height: 62px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: grid; place-items: center;
      box-shadow: var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }
    .mark svg { width: 34px; height: 34px; color: #fff; animation: spin 8s linear infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.08); } }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-4);
      background: rgba(0, 230, 195, 0.1);
      border: 1px solid rgba(0, 230, 195, 0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.4rem;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-4);
      box-shadow: 0 0 10px var(--accent-4);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    h1 {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    h1 .grad {
      background: linear-gradient(120deg, var(--accent-2), var(--accent-1) 40%, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: clamp(0.98rem, 2.4vw, 1.1rem);
      line-height: 1.6;
      max-width: 46ch;
      margin: 0 auto 2rem;
    }

    /* ============================================================
       Countdown
       ============================================================ */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      margin-bottom: 2.25rem;
      flex-wrap: wrap;
    }
    .cd-unit {
      min-width: 84px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-brd);
      border-radius: 16px;
      padding: 1rem 0.75rem 0.8rem;
      position: relative;
      overflow: hidden;
    }
    .cd-unit .num {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #fff, #cdd2ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
    }
    .cd-unit .lbl {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ============================================================
       Progress bar
       ============================================================ */
    .progress-wrap { max-width: 420px; margin: 0 auto 2.25rem; }
    .progress-top {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .progress-top strong { color: var(--text); }
    .progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-4));
      background-size: 200% 100%;
      animation: fillGrow 2.2s cubic-bezier(0.22,1,0.36,1) forwards, shimmer 2.5s linear infinite;
    }
    @keyframes fillGrow { to { width: 72%; } }
    @keyframes shimmer  { to { background-position: 200% 0; } }

    /* ============================================================
       Email signup
       ============================================================ */
    .notify { max-width: 460px; margin: 0 auto 1.75rem; }
    .notify form {
      display: flex;
      gap: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-brd);
      border-radius: 14px;
      padding: 0.4rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .notify form:focus-within {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 4px rgba(127,90,240,0.18);
    }
    .notify input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
    }
    .notify input::placeholder { color: var(--text-dim); }
    .btn {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      background-size: 180% 180%;
      transition: transform 0.2s, box-shadow 0.3s, background-position 0.5s;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(44,177,255,0.4);
      background-position: 100% 0;
    }
    .btn:active { transform: translateY(0); }
    .notify .msg {
      font-size: 0.82rem;
      margin-top: 0.7rem;
      min-height: 1.1rem;
      color: var(--accent-4);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .notify .msg.show { opacity: 1; }

    /* ============================================================
       Socials + footer
       ============================================================ */
    .socials {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }
    .socials a {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 12px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-brd);
      transition: transform 0.25s, color 0.25s, border-color 0.25s, background 0.25s;
    }
    .socials a:hover {
      transform: translateY(-4px);
      color: #fff;
      border-color: var(--accent-1);
      background: rgba(127,90,240,0.18);
    }
    .socials svg { width: 19px; height: 19px; }

    footer {
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    footer a { color: var(--accent-2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem 2.25rem; border-radius: 22px; }
      .cd-unit { min-width: 68px; }
      .notify form { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card" role="main">
    <div class="mark" aria-hidden="true">
      <span class="ring"></span>
      <span class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </span>
    </div>

    <span class="badge"><span class="dot"></span> System Upgrade in Progress</span>

    <h1>We&rsquo;re Making Things <span class="grad">Better</span></h1>
    <p class="subtitle">
      Our site is getting a fresh coat of paint and some powerful new features.
      We&rsquo;ll be back online shortly — thanks for your patience!
    </p>

    <div class="countdown" id="countdown" aria-label="Time remaining until relaunch">
      <div class="cd-unit"><span class="num" id="days">00</span><span class="lbl">Days</span></div>
      <div class="cd-unit"><span class="num" id="hours">00</span><span class="lbl">Hours</span></div>
      <div class="cd-unit"><span class="num" id="minutes">00</span><span class="lbl">Minutes</span></div>
      <div class="cd-unit"><span class="num" id="seconds">00</span><span class="lbl">Seconds</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-top"><span>Upgrade progress</span><strong>72%</strong></div>
      <div class="progress"><div class="fill"></div></div>
    </div>

    <div class="notify">
      <form id="notifyForm" novalidate>
        <input type="email" id="email" placeholder="Enter your email for launch updates" aria-label="Email address" required />
        <button class="btn" type="submit">Notify Me</button>
      </form>
      <p class="msg" id="notifyMsg" role="status" aria-live="polite"></p>
    </div>

    <nav class="socials" aria-label="Social links">
      <a href="#" aria-label="Twitter / X" title="Twitter / X">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="#" aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5zM3 9h4v12H3zM10 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.85V21h-4z"/></svg>
      </a>
      <a href="#" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49l-.01-1.7c-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.34 9.34 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9l-.01 2.82c0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
      </a>
    </nav>

    <footer>
      Need urgent help? <a href="mailto:hello@example.com">hello@example.com</a>
      &nbsp;&middot;&nbsp; &copy; <span id="year"></span> Your Company
    </footer>
  </main>

  <script>
    /* ---------- Year ---------- */
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ---------- Countdown timer ----------
       Counts down to a target 7 days from first load (persisted in localStorage
       so the timer stays consistent across refreshes for a given visitor). */
    (function () {
      var KEY = 'maintenance_launch_target';
      var target = parseInt(localStorage.getItem(KEY), 10);
      if (!target || isNaN(target)) {
        target = Date.now() + 7 * 24 * 60 * 60 * 1000; // 7 days from now
        localStorage.setItem(KEY, target);
      }
      var el = {
        d: document.getElementById('days'),
        h: document.getElementById('hours'),
        m: document.getElementById('minutes'),
        s: document.getElementById('seconds')
      };
      function pad(n) { return String(n).padStart(2, '0'); }
      function tick() {
        var diff = Math.max(0, target - Date.now());
        var s = Math.floor(diff / 1000);
        el.d.textContent = pad(Math.floor(s / 86400));
        el.h.textContent = pad(Math.floor((s % 86400) / 3600));
        el.m.textContent = pad(Math.floor((s % 3600) / 60));
        el.s.textContent = pad(s % 60);
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ---------- Notify form ---------- */
    (function () {
      var form = document.getElementById('notifyForm');
      var email = document.getElementById('email');
      var msg = document.getElementById('notifyMsg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var val = email.value.trim();
        var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if (!valid) {
          msg.textContent = 'Please enter a valid email address.';
          msg.style.color = 'var(--accent-3)';
          msg.classList.add('show');
          return;
        }
        msg.textContent = "You're on the list! We'll email you at launch. 🎉";
        msg.style.color = 'var(--accent-4)';
        msg.classList.add('show');
        email.value = '';
      });
    })();

    /* ---------- Particle field ---------- */
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var COUNT = 70;
      var w, h, dpr;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function init() {
        particles = [];
        for (var i = 0; i < COUNT; i++) {
          particles.push({
            x: rand(0, w), y: rand(0, h),
            vx: rand(-0.25, 0.25) * dpr, vy: rand(-0.25, 0.25) * dpr,
            r: rand(0.6, 2.2) * dpr
          });
        }
      }
      var colors = ['127,90,240', '44,177,255', '0,230,195', '255,92,138'];
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fill();
          // connect nearby particles
          for (var j = i + 1; j < particles.length; j++) {
            var q = particles[j];
            var dx = p.x - q.x, dy = p.y - q.y;
            var dist = dx * dx + dy * dy;
            var max = (120 * dpr) * (120 * dpr);
            if (dist < max) {
              var alpha = (1 - dist / max) * 0.28;
              ctx.strokeStyle = 'rgba(' + colors[i % colors.length] + ',' + alpha + ')';
              ctx.lineWidth = dpr * 0.6;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      resize(); init();
      if (!reduce) { draw(); }
      window.addEventListener('resize', function () { resize(); init(); });
    })();
  </script>
</body>
</html>
